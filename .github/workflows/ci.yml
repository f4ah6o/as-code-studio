name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test --run

      - name: Build frontend
        run: vp build

      - name: Smoke test — generate BPMN + SVG
        run: node src/bpmn/pipeline.js tests/fixtures/simple-approval.json /tmp/smoke-test
